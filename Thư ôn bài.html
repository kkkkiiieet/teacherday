@media (max-aspect-ratio:1/1){body::before{background-position:22% bottom}}
main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sân khấu: phong thư + thẻ */
.stage{--w:min(80vw,320px);--eh:calc(var(--w)*.68);width:var(--w);margin:0 auto;padding-top:calc(var(--eh)*1.22)}
.env{position:relative;width:100%;height:var(--eh);perspective:1000px}
.back-panel{position:absolute;inset:0;z-index:0;border-radius:10px;background:var(--c);filter:brightness(.72);box-shadow:0 18px 30px -18px rgba(10,20,50,.55)}
.front-panel{position:absolute;inset:0;z-index:3;border-radius:10px;background:var(--c);filter:brightness(.92);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;top:0;width:100%;height:55%;z-index:4;border-radius:10px 10px 0 0;background:var(--c);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;filter:brightness(1.12);
  transition:transform .5s ease .5s,z-index 0s .75s,filter .5s ease .5s}
.open .flap{transform:rotateX(180deg);z-index:1;filter:brightness(.8);transition:transform .6s ease 0s,z-index 0s .3s,filter .6s ease 0s}
.seal{position:absolute;left:50%;top:55%;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  display:grid;place-items:center;background:#fff;color:#14213d;font-weight:800;font-size:.8rem;box-shadow:0 2px 8px rgba(10,20,50,.28);transition:opacity .2s ease}
.open .seal{opacity:0}
.hit{position:absolute;inset:0;z-index:10;border:0;background:none;border-radius:10px;cursor:pointer}
.hit:focus-visible{outline:3px solid var(--accent);outline-offset:4px}

/* thẻ */
.card{position:absolute;left:7%;bottom:6%;width:86%;height:90%;z-index:2;display:flex;align-items:center;justify-content:center;padding:16px;
  border-radius:14px;background:var(--surface);color:var(--fg);border:2px solid var(--bd);text-align:center;
  box-shadow:0 10px 22px -14px rgba(10,20,50,.5);
  translate:0 0;scale:1;transform-origin:50% 100%;transition:scale .3s ease,translate .5s ease .2s}
.open .card{translate:0 -113%;scale:1.25;transition:translate .9s cubic-bezier(.3,.1,.2,1) .5s,scale .5s ease 1.35s}
.txt{display:block;max-height:100%;overflow:auto;font-size:1rem;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}

.status{margin:28px 0 0;text-align:center;color:var(--muted);min-height:1.6em}
.row{display:flex;justify-content:center;min-height:48px;margin-top:12px}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<main>
  <h1 class="sr-only">Thư gửi thầy cô</h1>

  <div class="stage" id="stage">
    <div class="env">
      <div class="back-panel"></div>
      <article class="card" id="card" aria-hidden="true"></article>
      <div class="front-panel"></div>
      <div class="flap"></div>
      <div class="seal">Mở</div>
      <button class="hit" id="hit" type="button" aria-label="Mở thư"></button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <div class="row"><button class="btn" id="next" type="button" hidden></button></div>
</main>
<script>
/* ====== NỘI DUNG 41 LÁ THƯ ======
   Gõ nội dung vào giữa cặp dấu `` theo đúng thứ tự: thư 1 đến thư 41.
   Nhấn Enter để xuống dòng. Để trống thì thẻ để trắng. */
const NOI_DUNG=[
`
Trương Ngọc An 
      Nhân ngày Nhà giáo Việt Nam 20/11, 
      em kính chúc cô luôn dồi dào sức khỏe, 
      an nhiên trong cuộc sống và mãi giữ vững ngọn lửa nhiệt huyết với sự nghiệp trồng người cao quý.
`, // Thư 1
`Nguyễn Phúc Hoàng Ân
      Kính chúc cô một ngày 20/11 thật ý nghĩa, 
      ngập tràn niềm vui và hạnh phúc bên gia đình cùng những thế hệ học trò luôn trân trọng công ơn của cô.
`, // Thư 2
`Đinh Thị Thanh Bình
      Cảm ơn cô vì đã tận tâm dìu dắt và truyền đạt cho chúng em không chỉ tri thức mà còn cả những bài học làm người sâu sắc. 
      Kính chúc cô luôn mạnh khỏe và bình an.
`, // Thư 3
`Nguyễn Thị Hương Dịu
      Nhân ngày Hiến chương Nhà giáo Việt Nam, em xin gửi tới cô lời tri ân sâu sắc nhất. 
      Kính chúc cô luôn rạng rỡ, 
      thành công và mãi là người lái đò vững vàng.
`, // Thư 4
`
Vũ Thành Doanh
      Nhân ngày 20/11, em xin chúc cô 1 sức khỏe dồi dào, luôn vui vẻ và hạnh phúc. 
      Cảm ơn cô đã dạy dỗ em trong suốt thời gian qua. 
      Em sẽ cố gắng học tập thật tốt để không phụ lòng cô.

`, // Thư 5
`Nguyễn Bảo Duy
      Sự kiên nhẫn, bao dung và tận tụy của cô là hành trang quý giá theo chúng em suốt cuộc đời. 
      Kính chúc cô ngày 20/11 thật nhiều sức khỏe và niềm vui trọn vẹn.
`, // Thư 6
`Trần Hoàng Duy
      Kính chúc cô luôn vững bước trên con đường sự nghiệp giáo dục, 
      gặt hái được nhiều thành tựu đáng tự hào và luôn cảm thấy hạnh phúc với lựa chọn của mình.
`, // Thư 7
`Đỗ Thị Hồng Hạnh
      Nhân dịp 20/11, em kính chúc cô sức khỏe dồi dào, 
      tinh thần minh mẫn và luôn được bao quanh bởi sự yêu thương, 
      kính trọng của đồng nghiệp và học sinh.
`, // Thư 8
`Đinh Hoàng Bảo Hân
      Từng lời dạy bảo của cô là ngọn đèn soi sáng cho chúng em trưởng thành. 
      Kính chúc cô ngày lễ 20/11 tràn đầy bình an và những niềm vui giản dị nhất.
`, // Thư 9
`Vũ Ánh Hồng
      Thay mặt tập thể học sinh, em xin kính chúc cô luôn mạnh khỏe, 
      hạnh phúc và tiếp tục chắp cánh ước mơ cho nhiều thế hệ học trò mai sau.
`, // Thư 10
`Lê Thị Như Huệ
      Kính chúc cô có một ngày 20/11 thật ấm áp, 
      ý nghĩa và luôn giữ được nụ cười hiền hậu, 
      tươi tắn trên bục giảng
`, // Thư 11
`Nguyễn Anh Khoa
      Dù có những lúc chúng em còn chưa ngoan hay khiến cô bận lòng, 
      chúng em vẫn luôn biết ơn sự tận tâm của cô. 
      Kính chúc cô mãi an nhiên và vui khỏe.
`, // Thư 12
` Hoàng Tuấn Kiệt
      Nhân ngày 20/11, em xin gửi lời chúc sức khỏe và hạnh phúc đến cô.
      Chúc cô không bao giờ phải dùng đến aspirin hay paracetamol.
      Và cũng chúc cô có thể tiêu hết được lượng lipid trong cơ thể như ước muốn của mình.
`, // Thư 13
`Lê Hoàng Gia Lâm
      Cảm ơn cô vì đã luôn bao dung, 
      lắng nghe và đồng hành cùng tập thể lớp chúng em qua từng chặng đường. 
      Kính chúc cô luôn dồi dào sức khỏe và an vui.
`, // Thư 14
`Trần Lê Trúc Lâm
      Làm cô chủ nhiệm của chúng em hẳn có nhiều vất vả, 
      nhưng nhờ có cô mà lớp luôn đoàn kết và vững vàng. 
      Kính chúc cô thật nhiều sức khỏe và niềm vui.
`, // Thư 15
`Đinh Thị Thảo Linh
      Kính chúc cô luôn giữ được sự nhiệt thành, 
      tâm huyết và mãi là chỗ dựa tinh thần đáng tin cậy cho chúng em trong suốt quãng thời gian học tập.
`, // Thư 16
`Hoàng Thị Thùy Linh
      Sự quan tâm chu đáo và những lời khuyên chân thành của cô đã giúp chúng em hoàn thiện bản thân hơn mỗi ngày.

];
const cards=PAL.map((p,i)=>({c:p[0],bd:p[1],t:NOI_DUNG[i]||''}));
const $=id=>document.getElementById(id);
const stage=$('stage'),card=$('card'),hit=$('hit'),next=$('next'),status=$('status');
let i=0,state='closed';

function load(){
  const d=cards[i];
  stage.style.setProperty('--c',d.c);stage.style.setProperty('--bd',d.bd);
  card.innerHTML='<span class="txt"></span>';
  card.firstChild.textContent=d.t;
  card.setAttribute('aria-hidden','true');
  status.textContent='Thư '+(i+1)+'/'+cards.length+'. Chạm vào phong thư để mở.';
}
hit.addEventListener('click',()=>{
  if(state!=='closed')return;
  state='opening';
  stage.classList.add('open');
  card.removeAttribute('aria-hidden');
  hit.hidden=true;
  status.textContent='';
  setTimeout(()=>{
    state='out';
    status.textContent='Thư '+(i+1)+'/'+cards.length;
    next.textContent=i===cards.length-1?'Làm lại từ đầu':'Thư tiếp theo';
    next.hidden=false;next.focus({preventScroll:true});
  },1900);
});
next.addEventListener('click',()=>{
  if(state!=='out')return;
  state='closing';
  next.hidden=true;
  stage.classList.remove('open');
  setTimeout(()=>{
    i=(i+1)%cards.length;
    load();
    hit.hidden=false;
    state='closed';
    hit.focus({preventScroll:true});
  },1100);
});
load();
</script>
